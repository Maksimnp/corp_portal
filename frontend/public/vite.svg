<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Тень -->
  <rect x="25" y="25" width="190" height="190" rx="40" ry="40" fill="#000000" opacity="0.15"></rect>
  
  <!-- Основной фон -->
  <rect x="20" y="20" width="190" height="190" rx="36" ry="36" fill="#1E293B"></rect>
  
  <!-- Верхний текст (МХП) -->
  <text x="115" y="110" text-anchor="middle" font-family="Roboto, sans-serif" font-size="64" font-weight="bold" fill="#FFFFFF">
    МХП
  </text>
  
  <!-- Нижний текст (Корпоративный портал) -->
